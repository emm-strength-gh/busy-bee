<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Markdown Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light-theme">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark-theme" disabled>
<style>
  :root {
    --bg: #ffffff;
    --bg-panel: #f7f6f3;
    --text: #1a1a18;
    --text-secondary: #6b6a65;
    --border: #e3e1da;
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
    --code-bg: #f1efe8;
    --shadow: rgba(0,0,0,0.06);
  }
  [data-theme="dark"] {
    --bg: #17181a;
    --bg-panel: #1e2023;
    --text: #e8e7e3;
    --text-secondary: #9a988f;
    --border: #33352f;
    --accent: #7fb2e8;
    --accent-bg: #1c2f42;
    --code-bg: #24262a;
    --shadow: rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: calc(12px + env(safe-area-inset-top)) 20px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
  }
  .filename {
    font-size: 13px;
    color: var(--text-secondary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  button, .file-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover, .file-btn:hover { border-color: var(--accent); }
  input[type="file"] { display: none; }
  .toc-toggle { display: none; }

  .layout {
    display: flex;
    max-width: 1100px;
    margin: 0 auto;
  }
  .toc {
    width: 220px;
    flex-shrink: 0;
    padding: 28px 12px 40px 20px;
    position: sticky;
    top: calc(53px + env(safe-area-inset-top));
    align-self: flex-start;
    max-height: calc(100vh - 53px - env(safe-area-inset-top));
    overflow-y: auto;
    font-size: 13px;
  }
  .toc a {
    display: block;
    padding: 4px 8px;
    color: var(--text-secondary);
    text-decoration: none;
    border-radius: 5px;
    line-height: 1.4;
  }
  .toc a:hover { background: var(--bg-panel); color: var(--text); }
  .toc a.active { color: var(--accent); background: var(--accent-bg); font-weight: 500; }
  .toc-empty { color: var(--text-secondary); font-style: italic; }

  main {
    flex: 1;
    min-width: 0;
    padding: 40px 48px 100px;
  }
  .dropzone {
    margin: 60px auto;
    max-width: 480px;
    text-align: center;
    padding: 48px 32px;
    border: 2px dashed var(--border);
    border-radius: 14px;
    color: var(--text-secondary);
  }
  .dropzone.dragover {
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .dropzone p { margin: 6px 0; }
  .dropzone .big { font-size: 16px; color: var(--text); font-weight: 500; }

  #content { font-size: 16px; line-height: 1.7; }
  #content h1, #content h2, #content h3, #content h4 {
    font-weight: 600;
    line-height: 1.3;
    margin-top: 1.8em;
    margin-bottom: 0.5em;
    scroll-margin-top: 70px;
  }
  #content h1 { font-size: 28px; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
  #content h2 { font-size: 22px; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
  #content h3 { font-size: 18px; }
  #content h4 { font-size: 16px; }
  #content p, #content ul, #content ol { margin: 0.9em 0; }
  #content ul, #content ol { padding-left: 1.6em; }
  #content li { margin: 0.3em 0; }
  #content a { color: var(--accent); }
  #content blockquote {
    margin: 1em 0;
    padding: 4px 16px;
    border-left: 3px solid var(--accent);
    background: var(--bg-panel);
    color: var(--text-secondary);
  }
  #content code {
    font-family: "SF Mono", Consolas, Menlo, monospace;
    font-size: 0.88em;
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
  }
  #content pre {
    background: var(--code-bg);
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
    border: 1px solid var(--border);
  }
  #content pre code { background: none; padding: 0; }
  #content table {
    border-collapse: collapse;
    width: 100%;
    margin: 1.2em 0;
    font-size: 14.5px;
  }
  #content th, #content td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
  }
  #content th { background: var(--bg-panel); font-weight: 600; }
  #content img { max-width: 100%; border-radius: 6px; }
  #content hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  #content input[type="checkbox"] { margin-right: 6px; }

  @media (max-width: 800px) {
    .toc { display: none; }
    main { padding: 24px 20px 80px; }
    .topbar h1 { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Markdown Viewer</h1>
  <span class="filename" id="filename">No file loaded</span>
  <label class="file-btn" for="fileInput">Open .md file</label>
  <input type="file" id="fileInput" accept=".md,.markdown,.txt">
  <button id="themeToggle">Dark mode</button>
</div>

<div class="layout">
  <nav class="toc" id="toc">
    <div class="toc-empty">Headings will appear here</div>
  </nav>
  <main>
    <div class="dropzone" id="dropzone">
      <p class="big">Drop a .md file here</p>
      <p>or use "Open .md file" above</p>
    </div>
    <div id="content"></div>
  </main>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const dropzone = document.getElementById('dropzone');
  const content = document.getElementById('content');
  const filenameEl = document.getElementById('filename');
  const toc = document.getElementById('toc');
  const themeToggle = document.getElementById('themeToggle');

  marked.setOptions({
    breaks: true,
    gfm: true,
    highlight: function(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
      }
      return hljs.highlightAuto(code).value;
    }
  });

  function renderMarkdown(text, name) {
    content.innerHTML = marked.parse(text);
    dropzone.style.display = 'none';
    filenameEl.textContent = name || 'Untitled document';
    buildTOC();
    document.querySelectorAll('pre code').forEach(block => {
      if (!block.classList.contains('hljs')) hljs.highlightElement(block);
    });
  }

  function buildTOC() {
    const headings = content.querySelectorAll('h1, h2, h3');
    toc.innerHTML = '';
    if (!headings.length) {
      toc.innerHTML = '<div class="toc-empty">No headings found</div>';
      return;
    }
    headings.forEach((h, i) => {
      const id = 'heading-' + i;
      h.id = id;
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent;
      a.style.paddingLeft = (h.tagName === 'H1' ? 8 : h.tagName === 'H2' ? 20 : 32) + 'px';
      a.addEventListener('click', (e) => {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      toc.appendChild(a);
    });
  }

  function loadFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => renderMarkdown(e.target.result, file.name);
    reader.readAsText(file);
  }

  fileInput.addEventListener('change', (e) => loadFile(e.target.files[0]));

  ['dragenter', 'dragover'].forEach(evt => {
    document.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
  });
  ['dragleave', 'drop'].forEach(evt => {
    document.addEventListener(evt, (e) => {
      e.preventDefault();
      if (evt === 'drop') {
        const file = e.dataTransfer.files[0];
        loadFile(file);
      }
      dropzone.classList.remove('dragover');
    });
  });

  themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('hljs-light-theme').disabled = !isDark;
    document.getElementById('hljs-dark-theme').disabled = isDark;
    themeToggle.textContent = isDark ? 'Dark mode' : 'Light mode';
  });

  // Scroll spy for TOC active state
  window.addEventListener('scroll', () => {
    const headings = content.querySelectorAll('h1, h2, h3');
    let current = null;
    headings.forEach(h => {
      if (h.getBoundingClientRect().top < 100) current = h.id;
    });
    toc.querySelectorAll('a').forEach(a => {
      a.classList.toggle('active', a.getAttribute('href') === '#' + current);
    });
  });
</script>
</body>
</html>
