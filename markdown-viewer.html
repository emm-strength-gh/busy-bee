<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Markdown Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light-theme">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark-theme" disabled>
<style>
  :root {
    --bg: #ffffff;
    --bg-panel: #f7f6f3;
    --text: #1a1a18;
    --text-secondary: #6b6a65;
    --border: #e3e1da;
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
    --code-bg: #f1efe8;
    --shadow: rgba(0,0,0,0.06);
  }
  [data-theme="dark"] {
    --bg: #17181a;
    --bg-panel: #1e2023;
    --text: #e8e7e3;
    --text-secondary: #9a988f;
    --border: #33352f;
    --accent: #7fb2e8;
    --accent-bg: #1c2f42;
    --code-bg: #24262a;
    --shadow: rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: calc(12px + env(safe-area-inset-top)) 20px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
  }
  .filename {
    font-size: 13px;
    color: var(--text-secondary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  button, .file-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover, .file-btn:hover { border-color: var(--accent); }
  input[type="file"] { display: none; }
  .toc-toggle { display: none; }

  /* ---------- Highlighter toolbar ---------- */
  .hl-tools { display: flex; align-items: center; gap: 8px; }
  .hl-colors { display: flex; align-items: center; gap: 5px; padding-right: 4px; border-right: 1px solid var(--border); margin-right: 2px; }
  .hl-swatch {
    width: 22px; height: 22px; padding: 0; border-radius: 50%;
    border: 2px solid var(--border); background: var(--sw); cursor: pointer;
    transition: transform .1s ease, border-color .1s ease;
  }
  .hl-swatch:hover { transform: scale(1.12); border-color: var(--text-secondary); }
  .hl-swatch.active { border-color: var(--text); transform: scale(1.12); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--text); }
  .hl-mode-btn { display: inline-flex; align-items: center; gap: 5px; }
  .hl-mode-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .hl-mode-btn.active svg { stroke: #fff; }
  .clear-btn { display: inline-flex; align-items: center; gap: 5px; color: var(--text-secondary); }
  .clear-btn:hover { border-color: #d9534f; color: #d9534f; }
  .clear-btn:hover svg { stroke: #d9534f; }

  /* Toolbar container: on desktop this is just an inline row (unchanged appearance).
     On narrow screens it becomes a dropdown panel opened by .menu-toggle. */
  .toolbar-panel { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .toolbar-sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 0; }
  #hlTools[hidden] + .toolbar-sep { display: none; }
  .menu-toggle {
    display: none; align-items: center; justify-content: center;
    width: 34px; height: 34px; padding: 0; border-radius: 9px; flex: none;
  }

  /* Highlight marks + interaction cursors */
  #content mark.hl { border-radius: 3px; padding: .05em 0; color: inherit; background-color: var(--hl-fallback, #ffe066); }
  #content mark.hl[data-color="yellow"] { background-color: rgba(255,224,102,.62); }
  #content mark.hl[data-color="green"]  { background-color: rgba(120,205,110,.55); }
  #content mark.hl[data-color="blue"]   { background-color: rgba(120,190,245,.52); }
  #content mark.hl[data-color="pink"]   { background-color: rgba(246,150,195,.52); }
  #content mark.hl[data-color="orange"] { background-color: rgba(255,180,110,.58); }
  [data-theme="dark"] #content mark.hl[data-color="yellow"] { background-color: rgba(255,214,71,.34); }
  [data-theme="dark"] #content mark.hl[data-color="green"]  { background-color: rgba(120,205,110,.30); }
  [data-theme="dark"] #content mark.hl[data-color="blue"]   { background-color: rgba(120,190,245,.30); }
  [data-theme="dark"] #content mark.hl[data-color="pink"]   { background-color: rgba(246,150,195,.30); }
  [data-theme="dark"] #content mark.hl[data-color="orange"] { background-color: rgba(255,180,110,.32); }
  body.mode-highlight #content { cursor: text; }
  body.mode-erase #content { cursor: pointer; }
  body.mode-erase #content mark.hl:hover { outline: 2px dashed var(--accent); outline-offset: 1px; }
  .hl-hint { font-size: 12px; color: var(--text-secondary); padding: 8px 20px; background: var(--accent-bg); border-bottom: 1px solid var(--border); display: none; }
  .hl-hint.show { display: block; }

  .layout {
    display: flex;
    max-width: 1100px;
    margin: 0 auto;
  }
  .toc {
    width: 220px;
    flex-shrink: 0;
    padding: 28px 12px 40px 20px;
    position: sticky;
    top: calc(53px + env(safe-area-inset-top));
    align-self: flex-start;
    max-height: calc(100vh - 53px - env(safe-area-inset-top));
    overflow-y: auto;
    font-size: 13px;
  }
  .toc a {
    display: block;
    padding: 4px 8px;
    color: var(--text-secondary);
    text-decoration: none;
    border-radius: 5px;
    line-height: 1.4;
  }
  .toc a:hover { background: var(--bg-panel); color: var(--text); }
  .toc a.active { color: var(--accent); background: var(--accent-bg); font-weight: 500; }
  .toc-empty { color: var(--text-secondary); font-style: italic; }

  main {
    flex: 1;
    min-width: 0;
    padding: 40px 48px 100px;
  }
  .dropzone {
    margin: 60px auto;
    max-width: 480px;
    text-align: center;
    padding: 48px 32px;
    border: 2px dashed var(--border);
    border-radius: 14px;
    color: var(--text-secondary);
  }
  .dropzone.dragover {
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .dropzone p { margin: 6px 0; }
  .dropzone .big { font-size: 16px; color: var(--text); font-weight: 500; }

  #content { font-size: 16px; line-height: 1.7; }
  #content h1, #content h2, #content h3, #content h4 {
    font-weight: 600;
    line-height: 1.3;
    margin-top: 1.8em;
    margin-bottom: 0.5em;
    scroll-margin-top: 70px;
  }
  #content h1 { font-size: 28px; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
  #content h2 { font-size: 22px; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
  #content h3 { font-size: 18px; }
  #content h4 { font-size: 16px; }
  #content p, #content ul, #content ol { margin: 0.9em 0; }
  #content ul, #content ol { padding-left: 1.6em; }
  #content li { margin: 0.3em 0; }
  #content a { color: var(--accent); }
  #content blockquote {
    margin: 1em 0;
    padding: 4px 16px;
    border-left: 3px solid var(--accent);
    background: var(--bg-panel);
    color: var(--text-secondary);
  }
  #content code {
    font-family: "SF Mono", Consolas, Menlo, monospace;
    font-size: 0.88em;
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
  }
  #content pre {
    background: var(--code-bg);
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
    border: 1px solid var(--border);
  }
  #content pre code { background: none; padding: 0; }
  #content table {
    border-collapse: collapse;
    width: 100%;
    margin: 1.2em 0;
    font-size: 14.5px;
  }
  #content th, #content td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
  }
  #content th { background: var(--bg-panel); font-weight: 600; }
  #content img { max-width: 100%; border-radius: 6px; }
  #content hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  #content input[type="checkbox"] { margin-right: 6px; }

  @media (max-width: 800px) {
    .toc { display: none; }
    main { padding: 24px 20px 80px; }
    .topbar h1 { display: none; }
    .filename { flex: 1 1 auto; }

    .menu-toggle { display: inline-flex; }
    .toolbar-panel {
      position: absolute; top: 100%; right: 12px; margin-top: 8px;
      display: none; flex-direction: column; align-items: stretch; gap: 10px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
      box-shadow: 0 14px 36px var(--shadow); padding: 12px;
      min-width: 230px; max-width: calc(100vw - 24px); z-index: 30;
    }
    .toolbar-panel.open { display: flex; }
    .toolbar-panel .hl-tools { flex-direction: column; align-items: stretch; gap: 8px; }
    .toolbar-panel .hl-colors {
      justify-content: center; border-right: none; margin-right: 0; padding-right: 0;
      padding-bottom: 9px; border-bottom: 1px solid var(--border);
    }
    .toolbar-panel .hl-mode-btn,
    .toolbar-panel .file-btn,
    .toolbar-panel .clear-btn,
    .toolbar-panel #themeToggle { width: 100%; justify-content: center; }
    .toolbar-sep { width: auto; height: 1px; align-self: stretch; margin: 0; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Markdown Viewer</h1>
  <span class="filename" id="filename">No file loaded</span>
  <button class="menu-toggle" id="menuToggle" aria-label="Tools menu" aria-expanded="false" aria-haspopup="true">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
  </button>
  <div class="toolbar-panel" id="toolbarPanel">
    <div class="hl-tools" id="hlTools" hidden>
      <div class="hl-colors" id="hlColors">
        <button class="hl-swatch active" data-color="yellow" style="--sw:#ffe066" title="Yellow highlighter" aria-label="Yellow highlighter"></button>
        <button class="hl-swatch" data-color="green" style="--sw:#a7e0a0" title="Green highlighter" aria-label="Green highlighter"></button>
        <button class="hl-swatch" data-color="blue" style="--sw:#9cd0f5" title="Blue highlighter" aria-label="Blue highlighter"></button>
        <button class="hl-swatch" data-color="pink" style="--sw:#f6a9c9" title="Pink highlighter" aria-label="Pink highlighter"></button>
        <button class="hl-swatch" data-color="orange" style="--sw:#ffc078" title="Orange highlighter" aria-label="Orange highlighter"></button>
      </div>
      <button id="hlBtn" class="hl-mode-btn" title="Highlighter — select text to highlight" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-6 6v3h3l6-6"/><path d="m14 6 4 4"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L13 14l-4 1 1-4 8.5-8.5Z"/></svg>
        Highlight
      </button>
      <button id="eraseBtn" class="hl-mode-btn" title="Eraser — click or drag over a highlight to remove it" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4-4a2 2 0 0 1 0-2.8l9.6-9.6a2 2 0 0 1 2.8 0l4.8 4.8a2 2 0 0 1 0 2.8L13 21"/><path d="M22 21H7"/><path d="m5 11 6 6"/></svg>
        Erase
      </button>
    </div>
    <div class="toolbar-sep" aria-hidden="true"></div>
    <label class="file-btn" for="fileInput">Open .md file</label>
    <input type="file" id="fileInput" accept=".md,.markdown,.txt">
    <button id="clearBtn" class="clear-btn" title="Close the current file (your saved highlights are kept for next time)" hidden>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      Clear
    </button>
    <button id="themeToggle">Dark mode</button>
  </div>
</div>
<div class="hl-hint" id="hlHint"></div>

<div class="layout">
  <nav class="toc" id="toc">
    <div class="toc-empty">Headings will appear here</div>
  </nav>
  <main>
    <div class="dropzone" id="dropzone">
      <p class="big">Drop a .md file here</p>
      <p>or use "Open .md file" above</p>
    </div>
    <div id="content"></div>
  </main>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const dropzone = document.getElementById('dropzone');
  const content = document.getElementById('content');
  const filenameEl = document.getElementById('filename');
  const toc = document.getElementById('toc');
  const themeToggle = document.getElementById('themeToggle');
  const hlTools = document.getElementById('hlTools');
  const hlBtn = document.getElementById('hlBtn');
  const eraseBtn = document.getElementById('eraseBtn');
  const clearBtn = document.getElementById('clearBtn');
  const hlHint = document.getElementById('hlHint');
  const hlColorsWrap = document.getElementById('hlColors');
  const menuToggle = document.getElementById('menuToggle');
  const toolbarPanel = document.getElementById('toolbarPanel');

  // ---------- Highlight state ----------
  const HL_PREFIX = 'mdv-highlights::v1::';
  let currentFileName = null;   // key we store highlights under
  let highlights = [];          // [{block, start, end, color}] — char offsets within a block
  let currentColor = 'yellow';
  let mode = null;              // null | 'highlight' | 'erase'

  marked.setOptions({
    breaks: true,
    gfm: true,
    highlight: function(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
      }
      return hljs.highlightAuto(code).value;
    }
  });

  function storageKey(name) { return HL_PREFIX + name; }

  function loadStoredHighlights(name) {
    try {
      const raw = localStorage.getItem(storageKey(name));
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed.filter(h =>
        typeof h.block === 'number' && typeof h.start === 'number' &&
        typeof h.end === 'number' && h.end > h.start) : [];
    } catch (e) { return []; }
  }

  function persistHighlights() {
    if (!currentFileName) return;
    try {
      if (highlights.length) localStorage.setItem(storageKey(currentFileName), JSON.stringify(highlights));
      else localStorage.removeItem(storageKey(currentFileName));
    } catch (e) {}
    // Tell the parent Busy Bee app so it can fold these into its single JSON backup — this
    // path also covers the case where the iframe doesn't share the parent's localStorage.
    notifyParent();
  }
  function notifyParent() {
    if (!currentFileName) return;
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'mdv-highlights-changed', name: currentFileName, highlights: highlights }, '*');
      }
    } catch (e) {}
  }

  // Highlights auto-persist to localStorage on every change (which the main Busy Bee app
  // folds into its single JSON "Save backup"), so there's no separate Save button here.
  function markDirty() {}

  // The block elements highlights are indexed against: direct children of #content.
  function contentBlocks() { return Array.from(content.children); }

  // Total visible-text length of a node (used for offset math).
  function textLen(node) { return node.textContent.length; }

  // Apply every stored highlight onto the freshly-rendered DOM.
  function applyHighlights() {
    const blocks = contentBlocks();
    // Group by block so we can apply from the end backwards (keeps offsets valid).
    const byBlock = {};
    highlights.forEach((h, idx) => {
      if (h.block < 0 || h.block >= blocks.length) return;
      (byBlock[h.block] = byBlock[h.block] || []).push(Object.assign({ _i: idx }, h));
    });
    Object.keys(byBlock).forEach(bi => {
      const ranges = byBlock[bi].slice().sort((a, b) => a.start - b.start);
      // Apply left-to-right but re-resolve offsets each time via a fresh walk.
      ranges.forEach(r => wrapRangeInBlock(blocks[bi], r.start, r.end, r.color, r._i));
    });
  }

  // Walk text nodes of `block`, wrap the [start,end) character span in <mark>.
  // Skips characters already inside a mark.hl so overlaps merge cleanly.
  function wrapRangeInBlock(block, start, end, color, hlIndex) {
    if (end <= start) return;
    let offset = 0;
    const toWrap = []; // {node, from, to}
    const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, null);
    let n;
    while ((n = walker.nextNode())) {
      const len = n.nodeValue.length;
      const nodeStart = offset, nodeEnd = offset + len;
      if (nodeEnd > start && nodeStart < end) {
        const from = Math.max(0, start - nodeStart);
        const to = Math.min(len, end - nodeStart);
        if (to > from && !(n.parentNode && n.parentNode.classList && n.parentNode.classList.contains('hl'))) {
          toWrap.push({ node: n, from, to });
        }
      }
      offset = nodeEnd;
      if (offset >= end) break;
    }
    // Wrap back-to-front so earlier splits don't invalidate later node refs.
    for (let i = toWrap.length - 1; i >= 0; i--) {
      const w = toWrap[i];
      const range = document.createRange();
      range.setStart(w.node, w.from);
      range.setEnd(w.node, w.to);
      const mark = document.createElement('mark');
      mark.className = 'hl';
      mark.setAttribute('data-color', color || 'yellow');
      if (hlIndex != null) mark.setAttribute('data-hl', hlIndex);
      try { range.surroundContents(mark); } catch (e) { /* range spans element boundary — skip that fragment */ }
    }
  }

  // Figure out which block a node lives in + the char offset of a (node,offset) point.
  function locateInBlocks(node, nodeOffset) {
    const blocks = contentBlocks();
    for (let bi = 0; bi < blocks.length; bi++) {
      if (!blocks[bi].contains(node)) continue;
      let offset = 0;
      const walker = document.createTreeWalker(blocks[bi], NodeFilter.SHOW_TEXT, null);
      let n;
      while ((n = walker.nextNode())) {
        if (n === node) return { block: bi, offset: offset + nodeOffset };
        offset += n.nodeValue.length;
      }
      // node is the block itself or an element node
      return { block: bi, offset: offset };
    }
    return null;
  }

  // Add a highlight from the current text selection.
  function highlightSelection() {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
    const range = sel.getRangeAt(0);
    if (!content.contains(range.commonAncestorContainer)) return;
    const a = locateInBlocks(range.startContainer, range.startOffset);
    const b = locateInBlocks(range.endContainer, range.endOffset);
    sel.removeAllRanges();
    if (!a || !b) return;
    // Only handle selections within a single block (keeps the model simple & robust).
    if (a.block !== b.block) {
      flashHint('Tip: highlight within one paragraph/section at a time.');
      return;
    }
    let start = Math.min(a.offset, b.offset), end = Math.max(a.offset, b.offset);
    if (end <= start) return;
    addHighlight(a.block, start, end, currentColor);
  }

  function addHighlight(block, start, end, color) {
    // Merge with existing highlights of the SAME color that overlap/touch,
    // and carve out overlaps with different colors (new color wins on overlap).
    let next = [];
    highlights.forEach(h => {
      if (h.block !== block) { next.push(h); return; }
      if (h.end < start || h.start > end) { next.push(h); return; } // no overlap
      if (h.color === color) { // absorb into the new range
        start = Math.min(start, h.start); end = Math.max(end, h.end); return;
      }
      // different color overlap: keep the non-overlapping remainders
      if (h.start < start) next.push({ block, start: h.start, end: start, color: h.color });
      if (h.end > end) next.push({ block, start: end, end: h.end, color: h.color });
    });
    next.push({ block, start, end, color });
    highlights = next;
    reflow();
    markDirty(true);
    persistHighlights(); // also auto-save so nothing is lost even before pressing Save
  }

  // Remove highlight(s) intersecting a click point inside a <mark>.
  function eraseAt(markEl) {
    const hi = markEl.getAttribute('data-hl');
    if (hi == null) { markEl.replaceWith(document.createTextNode(markEl.textContent)); return; }
    const idx = parseInt(hi, 10);
    if (!isNaN(idx) && idx >= 0 && idx < highlights.length) {
      highlights.splice(idx, 1);
      reflow();
      markDirty(true);
      persistHighlights();
    }
  }

  // Re-render highlights from the model without re-parsing markdown.
  // We rebuild by stripping existing marks then re-applying, so indices stay in sync.
  function reflow() {
    stripMarks();
    applyHighlights();
  }

  function stripMarks() {
    const marks = content.querySelectorAll('mark.hl');
    marks.forEach(m => {
      const parent = m.parentNode;
      while (m.firstChild) parent.insertBefore(m.firstChild, m);
      parent.removeChild(m);
      parent.normalize(); // merge adjacent text nodes so offset math stays correct
    });
  }

  function setMode(m) {
    mode = (mode === m) ? null : m;
    hlBtn.classList.toggle('active', mode === 'highlight');
    eraseBtn.classList.toggle('active', mode === 'erase');
    hlBtn.setAttribute('aria-pressed', String(mode === 'highlight'));
    eraseBtn.setAttribute('aria-pressed', String(mode === 'erase'));
    document.body.classList.toggle('mode-highlight', mode === 'highlight');
    document.body.classList.toggle('mode-erase', mode === 'erase');
    if (mode === 'highlight') showHint('Highlighter on — select any text to highlight it. Click "Highlight" again to turn off.');
    else if (mode === 'erase') showHint('Eraser on — click (or drag across) a highlight to remove it. Click "Erase" again to turn off.');
    else hideHint();
  }

  function showHint(msg) { hlHint.textContent = msg; hlHint.classList.add('show'); }
  function hideHint() { hlHint.classList.remove('show'); }
  let hintTimer = null;
  function flashHint(msg) {
    const prev = hlHint.textContent, wasShown = hlHint.classList.contains('show');
    showHint(msg); clearTimeout(hintTimer);
    hintTimer = setTimeout(() => {
      if (mode === 'highlight') showHint('Highlighter on — select any text to highlight it. Click "Highlight" again to turn off.');
      else if (mode === 'erase') showHint('Eraser on — click (or drag across) a highlight to remove it. Click "Erase" again to turn off.');
      else if (wasShown) showHint(prev); else hideHint();
    }, 2600);
  }

  function renderMarkdown(text, name) {
    content.innerHTML = marked.parse(text);
    dropzone.style.display = 'none';
    filenameEl.textContent = name || 'Untitled document';
    currentFileName = name || 'Untitled document';
    buildTOC();
    document.querySelectorAll('pre code').forEach(block => {
      if (!block.classList.contains('hljs')) hljs.highlightElement(block);
    });
    // Load + apply any saved highlights for this filename.
    highlights = loadStoredHighlights(currentFileName);
    applyHighlights();
    // Also ask the parent app for its mirrored copy, in case our storage isn't shared with it
    // (file://). It will postMessage the data back and we'll re-apply.
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'mdv-ready' }, '*'); } catch (e) {}
    hlTools.hidden = false;
    clearBtn.hidden = false;
    markDirty(false);
    if (highlights.length) flashHint(highlights.length + ' saved highlight' + (highlights.length === 1 ? '' : 's') + ' loaded for "' + currentFileName + '".');
  }

  function buildTOC() {
    const headings = content.querySelectorAll('h1, h2, h3');
    toc.innerHTML = '';
    if (!headings.length) {
      toc.innerHTML = '<div class="toc-empty">No headings found</div>';
      return;
    }
    headings.forEach((h, i) => {
      const id = 'heading-' + i;
      h.id = id;
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent;
      a.style.paddingLeft = (h.tagName === 'H1' ? 8 : h.tagName === 'H2' ? 20 : 32) + 'px';
      a.addEventListener('click', (e) => {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      toc.appendChild(a);
    });
  }

  function loadFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => renderMarkdown(e.target.result, file.name);
    reader.readAsText(file);
  }

  fileInput.addEventListener('change', (e) => { loadFile(e.target.files[0]); e.target.value = ''; });

  ['dragenter', 'dragover'].forEach(evt => {
    document.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
  });
  ['dragleave', 'drop'].forEach(evt => {
    document.addEventListener(evt, (e) => {
      e.preventDefault();
      if (evt === 'drop') {
        const file = e.dataTransfer.files[0];
        loadFile(file);
      }
      dropzone.classList.remove('dragover');
    });
  });

  themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('hljs-light-theme').disabled = !isDark;
    document.getElementById('hljs-dark-theme').disabled = isDark;
    themeToggle.textContent = isDark ? 'Dark mode' : 'Light mode';
  });

  // ---------- Highlighter wiring ----------
  hlColorsWrap.addEventListener('click', (e) => {
    const sw = e.target.closest('.hl-swatch');
    if (!sw) return;
    currentColor = sw.getAttribute('data-color');
    hlColorsWrap.querySelectorAll('.hl-swatch').forEach(s => s.classList.toggle('active', s === sw));
    if (mode !== 'highlight') setMode('highlight');
  });

  hlBtn.addEventListener('click', () => setMode('highlight'));
  eraseBtn.addEventListener('click', () => setMode('erase'));

  // Highlight on selection release (mouse or touch) while in highlight mode.
  document.addEventListener('mouseup', () => { if (mode === 'highlight') setTimeout(highlightSelection, 0); });
  content.addEventListener('touchend', () => { if (mode === 'highlight') setTimeout(highlightSelection, 0); });

  // Eraser: click, and drag-to-erase.
  let erasing = false;
  content.addEventListener('mousedown', (e) => {
    if (mode !== 'erase') return;
    erasing = true;
    const m = e.target.closest('mark.hl');
    if (m) { e.preventDefault(); eraseAt(m); }
  });
  content.addEventListener('mousemove', (e) => {
    if (mode !== 'erase' || !erasing) return;
    const m = e.target.closest('mark.hl');
    if (m) eraseAt(m);
  });
  document.addEventListener('mouseup', () => { erasing = false; });
  content.addEventListener('click', (e) => {
    if (mode !== 'erase') return;
    const m = e.target.closest('mark.hl');
    if (m) { e.preventDefault(); eraseAt(m); }
  });

  // Messages from the parent Busy Bee app.
  window.addEventListener('message', (e) => {
    const d = e && e.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'mdv-restore-highlights') {
      // The app restored a backup (or is handing us its mirror on startup). Write the
      // highlight data into OUR localStorage — this is what makes restore work even when the
      // iframe has a separate origin (file://) and doesn't share the parent's storage.
      try {
        if (d.replace) {
          const rm = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.indexOf(HL_PREFIX) === 0) rm.push(k);
          }
          rm.forEach(k => localStorage.removeItem(k));
        }
        if (d.map && typeof d.map === 'object') {
          Object.keys(d.map).forEach(name => {
            if (Array.isArray(d.map[name]) && d.map[name].length) localStorage.setItem(HL_PREFIX + name, JSON.stringify(d.map[name]));
          });
        }
      } catch (err) {}
      // If a file is open, refresh its highlights from the just-updated storage.
      if (currentFileName) {
        highlights = loadStoredHighlights(currentFileName);
        reflow();
        if (highlights.length) flashHint(highlights.length + ' highlight' + (highlights.length === 1 ? '' : 's') + ' restored from your backup.');
      }
    } else if (d.type === 'mdv-reload-highlights' && currentFileName) {
      // Legacy/shared-storage path: just re-read our storage.
      highlights = loadStoredHighlights(currentFileName);
      reflow();
    }
  });

  // Let the parent app know we're loaded so it can hand us any restored highlight data
  // (covers the case where the iframe loads lazily, after a backup was already opened).
  try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'mdv-ready' }, '*'); } catch (e) {}

  // Close the currently loaded file and return to the empty drop-zone state.
  // Saved highlights for this filename stay in storage, so re-opening the file restores them.
  function clearFile() {
    if (mode) setMode(mode); // toggles the active mode off, clears body classes + hint
    content.innerHTML = '';
    toc.innerHTML = '<div class="toc-empty">Headings will appear here</div>';
    highlights = [];
    currentFileName = null;
    filenameEl.textContent = 'No file loaded';
    dropzone.style.display = '';
    hlTools.hidden = true;
    clearBtn.hidden = true;
    hideHint();
  }
  clearBtn.addEventListener('click', clearFile);

  // ---------- Mobile "Tools" dropdown ----------
  // On desktop .toolbar-panel is just an inline row (menuToggle is display:none there, so
  // these handlers are inert). On narrow screens it becomes a floating dropdown.
  function openMenu() {
    toolbarPanel.classList.add('open');
    menuToggle.setAttribute('aria-expanded', 'true');
  }
  function closeMenu() {
    toolbarPanel.classList.remove('open');
    menuToggle.setAttribute('aria-expanded', 'false');
  }
  menuToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    toolbarPanel.classList.contains('open') ? closeMenu() : openMenu();
  });
  // Any action inside the panel closes it afterward, so the next tap lands on the document
  // (e.g. picking a highlight color, then immediately selecting text to highlight).
  toolbarPanel.addEventListener('click', (e) => {
    if (e.target.closest('button, label')) setTimeout(closeMenu, 0);
  });
  document.addEventListener('click', (e) => {
    if (toolbarPanel.classList.contains('open') && !toolbarPanel.contains(e.target) && e.target !== menuToggle) closeMenu();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

  // Scroll spy for TOC active state
  window.addEventListener('scroll', () => {
    const headings = content.querySelectorAll('h1, h2, h3');
    let current = null;
    headings.forEach(h => {
      if (h.getBoundingClientRect().top < 100) current = h.id;
    });
    toc.querySelectorAll('a').forEach(a => {
      a.classList.toggle('active', a.getAttribute('href') === '#' + current);
    });
  });
</script>
</body>
</html>
