<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Clock — 5 zones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1118;
    --panel:#151A24;
    --panel-2:#1A2130;
    --line:#252D3C;
    --text:#E9ECF4;
    --muted:#828CA0;
    --focus:#8FD3FF;
    --radius:14px;
    --row-gap:10px;
  }
  html[data-theme="light"]{
    --ink:#EEF0F5;
    --panel:#FFFFFF;
    --panel-2:#F6F7FB;
    --line:#DCE0EA;
    --text:#141824;
    --muted:#5C667A;
    --focus:#0B62A4;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:"Space Grotesk",system-ui,-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:calc(22px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    transition:background .4s ease,color .4s ease;
  }
  .shell{
    width:min(760px,100%);
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  /* ---------- header ---------- */
  .top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding:0 4px;
  }
  .wordmark{
    font-size:12px;
    font-weight:600;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--text);
  }
  .wordmark span{color:var(--muted);font-weight:400}
  .sync{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:7px;
    white-space:nowrap;
  }
  .pulse{
    width:6px;height:6px;border-radius:50%;
    background:#4B5566;
    flex:none;
  }
  .pulse.ok{background:#5BD6A0;box-shadow:0 0 0 0 rgba(91,214,160,.55);animation:ping 2.8s ease-out infinite}
  .pulse.warn{background:#E8B14C}
  .pulse.busy{background:#6FA8FF;animation:ping 1.1s ease-out infinite}
  @keyframes ping{
    0%{box-shadow:0 0 0 0 rgba(91,214,160,.45)}
    70%{box-shadow:0 0 0 7px rgba(91,214,160,0)}
    100%{box-shadow:0 0 0 0 rgba(91,214,160,0)}
  }

  /* ---------- clock rows ---------- */
  .board{
    display:flex;
    flex-direction:column;
    gap:var(--row-gap);
  }
  .row{
    position:relative;
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:14px;
    padding:38px 26px 38px 22px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    transition:background .9s linear,border-color .3s ease;
  }
  /* signature: ambient sky wash driven by that city's local hour */
  .row::before{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(100deg,var(--sky) 0%,transparent 62%);
    opacity:.34;
    pointer-events:none;
    transition:background 1.2s linear;
  }
  .row::after{
    content:"";
    position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--sky);
    transition:background 1.2s linear;
  }
  .row > *{position:relative}

  .flag{
    width:44px;height:28px;
    border-radius:3px;
    overflow:hidden;
    flex:none;
    box-shadow:0 0 0 1px rgba(255,255,255,.14),0 2px 6px rgba(0,0,0,.3);
    display:block;
  }
  html[data-theme="light"] .flag{box-shadow:0 0 0 1px rgba(0,0,0,.16),0 1px 4px rgba(0,0,0,.14)}
  .flag svg{display:block;width:100%;height:100%}

  .meta{min-width:0}
  .city{
    font-size:17px;
    font-weight:600;
    letter-spacing:.02em;
    line-height:1.15;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .sub{
    margin-top:7px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:11.5px;
    letter-spacing:.05em;
    color:var(--muted);
  }
  .sub .dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.5;flex:none}
  .state{
    display:inline-flex;align-items:center;gap:5px;
    text-transform:uppercase;
  }
  .state i{
    width:6px;height:6px;border-radius:50%;
    background:var(--sky);
    box-shadow:0 0 0 1px rgba(255,255,255,.18);
    flex:none;
  }
  .offset{
    padding:1px 6px;
    border:1px solid var(--line);
    border-radius:999px;
    color:var(--muted);
  }
  .wx{
    margin-top:6px;
    display:inline-flex;align-items:center;gap:6px;
    font-size:16px;
    font-weight:600;
    letter-spacing:.01em;
    color:var(--text);
    cursor:default;
    width:fit-content;
    background:rgba(255,159,28,.16);
    border:1px solid rgba(255,159,28,.4);
    padding:5px 12px;
    border-radius:999px;
  }
  .sub [data-date]{
    background:rgba(143,211,255,.16);
    border:1px solid rgba(143,211,255,.4);
    padding:2px 8px;
    border-radius:999px;
    color:var(--text);
  }
  .offset.here{color:var(--text);border-color:currentColor;opacity:.85}

  .time{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    font-size:var(--time-fs, clamp(3.2rem,11vw,5.6rem));
    line-height:.94;
    letter-spacing:-.02em;
    display:flex;
    align-items:baseline;
    gap:6px;
    justify-self:end;
  }
  .time .sec{
    font-size:.36em;
    font-weight:500;
    color:var(--muted);
    letter-spacing:.02em;
  }
  .time .mer{
    font-size:.3em;
    font-weight:600;
    letter-spacing:.14em;
    color:var(--muted);
  }
  /* ---------- control bar ---------- */
  .menu{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    padding:12px 14px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
  }
  .seg{
    display:flex;
    background:var(--ink);
    border:1px solid var(--line);
    border-radius:10px;
    padding:3px;
    gap:3px;
  }
  .seg button{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:11px;
    letter-spacing:.06em;
    padding:7px 13px;
    border:0;
    border-radius:7px;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    transition:background .18s ease,color .18s ease;
  }
  .seg button[aria-pressed="true"]{background:var(--text);color:var(--ink)}
  .seg button:hover{color:var(--text)}
  .seg button[aria-pressed="true"]:hover{color:var(--ink)}

  .toggle{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:11px;
    letter-spacing:.06em;
    padding:8px 13px;
    border:1px solid var(--line);
    border-radius:9px;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:7px;
    transition:color .18s ease,border-color .18s ease;
  }
  .toggle:hover{color:var(--text);border-color:var(--muted)}
  .toggle i{
    width:7px;height:7px;border-radius:2px;
    border:1px solid currentColor;
    flex:none;
  }
  .toggle[aria-pressed="true"]{color:var(--text);border-color:var(--muted)}
  .toggle[aria-pressed="true"] i{background:currentColor}
  .spacer{flex:1 1 auto}
  .fsize{
    display:inline-flex;
    align-items:center;
    gap:2px;
    border:1px solid var(--line);
    border-radius:9px;
    overflow:hidden;
  }
  .fsize button{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:13px;
    font-weight:600;
    width:30px;height:30px;
    border:none;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:color .18s ease,background .18s ease;
  }
  .fsize button:hover{color:var(--text);background:var(--line)}
  .fsize button:active{transform:scale(.94)}
  .fsize button:disabled{opacity:.35;cursor:default;background:transparent;transform:none}
  .fsize .fs-label{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:10.5px;
    letter-spacing:.04em;
    color:var(--muted);
    padding:0 9px;
    min-width:38px;
    text-align:center;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }
  button:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  .note{
    padding:0 6px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:10px;
    letter-spacing:.07em;
    color:var(--muted);
    opacity:.75;
  }

  @media (max-width:560px){
    .row{
      grid-template-columns:auto 1fr;
      gap:14px 12px;
      padding:26px 18px;
    }
    .time{grid-column:1 / -1;justify-self:start;margin-top:2px}
    .flag{width:38px;height:24px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<div class="shell">

  <div class="top">
    <div class="wordmark">World clock <span>/ five zones</span></div>
    <div class="sync" id="syncStatus"><span class="pulse busy" id="pulse"></span><span id="syncText">Contacting time server…</span></div>
  </div>

  <div class="board" id="board"></div>

  <div class="menu">
    <div class="seg" role="group" aria-label="Time format">
      <button type="button" id="f24" aria-pressed="true">24 HOUR</button>
      <button type="button" id="f12" aria-pressed="false">AM / PM</button>
    </div>
    <button type="button" class="toggle" id="tSec" aria-pressed="true"><i></i>SECONDS</button>
    <button type="button" class="toggle" id="tDate" aria-pressed="true"><i></i>DATE</button>
    <button type="button" class="toggle" id="tTheme" aria-pressed="false"><i></i>LIGHT</button>
    <div class="fsize" role="group" aria-label="Clock size">
      <button type="button" id="fsMinus" aria-label="Decrease clock size" title="Smaller (−2px)">&minus;</button>
      <span class="fs-label" id="fsLabel" aria-hidden="true"></span>
      <button type="button" id="fsPlus" aria-label="Increase clock size" title="Larger (+2px)">&plus;</button>
    </div>
    <div class="spacer"></div>
    <button type="button" class="toggle" id="btnSync">RESYNC</button>
  </div>

  <div class="note" id="driftNote"></div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- zones ---------------- */
  var ZONES = [
    { id:"uk",  city:"United Kingdom",  place:"London",         tz:"Europe/London",    flag:"gb", lat:51.5074,  lon:-0.1278,  unit:"c" },
    { id:"se",  city:"Sweden",          place:"Malm\u00f6",     tz:"Europe/Stockholm", flag:"se", lat:55.6050,  lon:13.0038,  unit:"c" },
    { id:"us1", city:"Eastern US",      place:"New York",       tz:"America/New_York", flag:"us", lat:40.7128,  lon:-74.0060, unit:"f" },
    { id:"us2", city:"Central US",      place:"Chicago",        tz:"America/Chicago",  flag:"us", lat:41.8781,  lon:-87.6298, unit:"f" },
    { id:"ph",  city:"Philippines",     place:"Silang, Cavite", tz:"Asia/Manila",      flag:"ph", lat:14.2379,  lon:120.9723, unit:"c" }
  ];

  /* ---------------- flags (inline svg, no emoji dependency) ---------------- */
  var usStripes = "";
  for (var s=0; s<13; s++){
    if (s % 2 === 0) usStripes += '<rect y="'+(s*10/13).toFixed(3)+'" width="19" height="'+(10/13).toFixed(3)+'" fill="#B31942"/>';
  }
  var FLAGS = {
    gb:'<svg viewBox="0 0 60 30" role="img" aria-label="United Kingdom">'+
       '<clipPath id="uk-t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>'+
       '<rect width="60" height="30" fill="#012169"/>'+
       '<path d="M0,0 L60,30 M60,0 L0,30" stroke="#FFF" stroke-width="6"/>'+
       '<path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk-t)" stroke="#C8102E" stroke-width="4"/>'+
       '<path d="M30,0 v30 M0,15 h60" stroke="#FFF" stroke-width="10"/>'+
       '<path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg>',
    se:'<svg viewBox="0 0 16 10" role="img" aria-label="Sweden">'+
       '<rect width="16" height="10" fill="#006AA7"/>'+
       '<rect x="5" width="2" height="10" fill="#FECC02"/>'+
       '<rect y="4" width="16" height="2" fill="#FECC02"/></svg>',
    us:'<svg viewBox="0 0 19 10" role="img" aria-label="United States">'+
       '<rect width="19" height="10" fill="#FFF"/>'+usStripes+
       '<rect width="7.6" height="5.385" fill="#0A3161"/>'+
       '<g fill="#FFF">'+
       '<circle cx="1.1" cy="0.75" r=".3"/><circle cx="2.7" cy="0.75" r=".3"/><circle cx="4.3" cy="0.75" r=".3"/><circle cx="5.9" cy="0.75" r=".3"/>'+
       '<circle cx="1.9" cy="1.75" r=".3"/><circle cx="3.5" cy="1.75" r=".3"/><circle cx="5.1" cy="1.75" r=".3"/><circle cx="6.7" cy="1.75" r=".3"/>'+
       '<circle cx="1.1" cy="2.75" r=".3"/><circle cx="2.7" cy="2.75" r=".3"/><circle cx="4.3" cy="2.75" r=".3"/><circle cx="5.9" cy="2.75" r=".3"/>'+
       '<circle cx="1.9" cy="3.75" r=".3"/><circle cx="3.5" cy="3.75" r=".3"/><circle cx="5.1" cy="3.75" r=".3"/><circle cx="6.7" cy="3.75" r=".3"/>'+
       '<circle cx="1.1" cy="4.7" r=".3"/><circle cx="2.7" cy="4.7" r=".3"/><circle cx="4.3" cy="4.7" r=".3"/><circle cx="5.9" cy="4.7" r=".3"/>'+
       '</g></svg>',
    ph:'<svg viewBox="0 0 18 9" role="img" aria-label="Philippines">'+
       '<rect width="18" height="4.5" fill="#0038A8"/>'+
       '<rect y="4.5" width="18" height="4.5" fill="#CE1126"/>'+
       '<path d="M0,0 L7.79,4.5 L0,9 Z" fill="#FFF"/>'+
       '<circle cx="2.6" cy="4.5" r=".95" fill="#FCD116"/>'+
       '<g fill="#FCD116"><circle cx="0.95" cy="1.15" r=".33"/><circle cx="0.95" cy="7.85" r=".33"/><circle cx="6.5" cy="4.5" r=".33"/></g></svg>'
  };

  /* ---------------- sky palette: hour of day -> ambient colour ---------------- */
  var SKY = [
    [0 ,"#1B2452"],[4 ,"#22285C"],[6 ,"#5B3A6B"],[7 ,"#8A4E4E"],
    [9 ,"#1D6C86"],[12,"#1E7FA0"],[16,"#2A7C93"],[18,"#95552A"],
    [20,"#4E2E58"],[22,"#1B2452"],[24,"#1B2452"]
  ];
  function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
  function skyFor(hourFloat){
    for (var i=0;i<SKY.length-1;i++){
      var a=SKY[i], b=SKY[i+1];
      if (hourFloat>=a[0] && hourFloat<=b[0]){
        var t=(b[0]===a[0])?0:(hourFloat-a[0])/(b[0]-a[0]);
        var ca=hex2rgb(a[1]), cb=hex2rgb(b[1]);
        return "rgb("+Math.round(ca[0]+(cb[0]-ca[0])*t)+","+
                      Math.round(ca[1]+(cb[1]-ca[1])*t)+","+
                      Math.round(ca[2]+(cb[2]-ca[2])*t)+")";
      }
    }
    return "#1B2452";
  }

  /* ---------------- settings ---------------- */
  var LS="worldclock.v1";
  var cfg={hour12:false,seconds:true,date:true,light:false,fontSize:null};
  try{ var raw=localStorage.getItem(LS); if(raw) cfg=Object.assign(cfg,JSON.parse(raw)); }catch(e){}
  function save(){ try{ localStorage.setItem(LS,JSON.stringify(cfg)); }catch(e){} }

  /* ---------------- online time sync ---------------- */
  var offsetMs = 0;              // trueTime = Date.now() + offsetMs
  var accuracyMs = null;
  var source = null;
  var syncing = false;

  function serverNow(){ return Date.now() + offsetMs; }

  function withTimeout(promise, ms){
    return new Promise(function(resolve,reject){
      var t=setTimeout(function(){reject(new Error("timeout"));},ms);
      promise.then(function(v){clearTimeout(t);resolve(v);},function(e){clearTimeout(t);reject(e);});
    });
  }

  var SOURCES = [
    { name:"cloudflare", url:"https://www.cloudflare.com/cdn-cgi/trace", parse:function(txt){
        var m=/(^|\n)ts=([0-9.]+)/.exec(txt);
        return m ? Math.round(parseFloat(m[2])*1000) : null;
      }, type:"text" },
    { name:"timeapi.io", url:"https://timeapi.io/api/Time/current/zone?timeZone=UTC", parse:function(j){
        return j && j.dateTime ? Date.parse(j.dateTime.slice(-1)==="Z"?j.dateTime:j.dateTime+"Z") : null;
      }, type:"json" },
    { name:"worldtimeapi", url:"https://worldtimeapi.org/api/timezone/Etc/UTC", parse:function(j){
        return j && j.unixtime ? (j.unixtime*1000 + (j.raw_offset?0:0)) : null;
      }, type:"json" }
  ];

  function trySource(src){
    var t0 = Date.now();
    return withTimeout(fetch(src.url,{cache:"no-store"}),4500).then(function(res){
      if(!res.ok) throw new Error("http "+res.status);
      return src.type==="json" ? res.json() : res.text();
    }).then(function(body){
      var t1 = Date.now();
      var server = src.parse(body);
      if(!server || isNaN(server)) throw new Error("unparsable");
      var rtt = t1 - t0;
      return { offset: (server + rtt/2) - t1, rtt: rtt, name: src.name };
    });
  }

  function sync(){
    if(syncing) return;
    syncing = true;
    setStatus("busy","Contacting time server…");
    var i = 0;
    function next(){
      if(i >= SOURCES.length){
        syncing = false;
        source = null; accuracyMs = null; offsetMs = 0;
        setStatus("warn","Device clock — no online source reachable");
        renderDrift();
        return;
      }
      trySource(SOURCES[i++]).then(function(r){
        syncing = false;
        offsetMs = r.offset;
        accuracyMs = Math.round(r.rtt/2);
        source = r.name;
        setStatus("ok","Synced · "+r.name+" · ±"+accuracyMs+" ms");
        renderDrift();
      }).catch(function(){ next(); });
    }
    next();
  }

  function setStatus(kind,text){
    document.getElementById("pulse").className = "pulse "+kind;
    document.getElementById("syncText").textContent = text;
  }

  function renderDrift(){
    var el = document.getElementById("driftNote");
    if(source === null){
      el.textContent = "Times are read from this device's clock and rendered in each zone. Press RESYNC to try the time servers again.";
      return;
    }
    var d = offsetMs;
    var word = Math.abs(d) < 900 ? "matches the time server"
             : (d > 0 ? "runs " + (d/1000).toFixed(1) + " s slow" : "runs " + (Math.abs(d)/1000).toFixed(1) + " s fast");
    el.textContent = "This device's clock " + word + ". Displayed times are corrected against " + source + ".";
  }

  /* ---------------- formatters ---------------- */
  var fmtCache = {};
  function partsFor(tz, date){
    var key = tz+"|p";
    if(!fmtCache[key]){
      fmtCache[key] = new Intl.DateTimeFormat("en-GB",{
        timeZone:tz, hour12:false, weekday:"short", day:"2-digit", month:"short",
        hour:"2-digit", minute:"2-digit", second:"2-digit"
      });
    }
    var out = {};
    fmtCache[key].formatToParts(date).forEach(function(p){ out[p.type]=p.value; });
    return out; // weekday, day, month, hour(00-23), minute, second
  }
  function tzAbbr(tz, date){
    var key = tz+"|a";
    if(!fmtCache[key]){
      fmtCache[key] = new Intl.DateTimeFormat("en-GB",{timeZone:tz, timeZoneName:"short", hour:"2-digit"});
    }
    var v = "";
    fmtCache[key].formatToParts(date).forEach(function(p){ if(p.type==="timeZoneName") v=p.value; });
    return v;
  }
  function tzOffsetMinutes(tz, date){
    var p = partsFor(tz, date);
    var asUTC = Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate(),
                         Number(p.hour)%24, Number(p.minute), Number(p.second));
    var diff = asUTC - Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate(),
                                date.getUTCHours(), date.getUTCMinutes(), date.getUTCSeconds());
    // wrap across the date line
    var mins = Math.round(diff/60000);
    if (mins > 900) mins -= 1440;
    if (mins < -900) mins += 1440;
    return mins;
  }

  var localZone = "";
  try { localZone = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch(e){}

  /* ---------------- build DOM ---------------- */
  var board = document.getElementById("board");
  var nodes = [];
  ZONES.forEach(function(z){
    var row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<span class="flag">'+FLAGS[z.flag]+'</span>'+
      '<div class="meta">'+
        '<div class="city">'+z.city+'</div>'+
        '<div class="sub">'+
          '<span class="state"><i></i><span data-state></span></span>'+
          '<span class="dot"></span>'+
          '<span data-date></span>'+
          '<span class="offset" data-offset></span>'+
        '</div>'+
        '<div class="wx" data-wx>&hellip;</div>'+
      '</div>'+
      '<div class="time"><span data-hm>--:--</span><span class="sec" data-sec></span><span class="mer" data-mer></span></div>';
    board.appendChild(row);
    nodes.push({
      zone:z, row:row,
      hm:row.querySelector("[data-hm]"),
      sec:row.querySelector("[data-sec]"),
      mer:row.querySelector("[data-mer]"),
      state:row.querySelector("[data-state]"),
      date:row.querySelector("[data-date]"),
      offset:row.querySelector("[data-offset]"),
      wx:row.querySelector("[data-wx]")
    });
  });

  /* ---------------- render loop ---------------- */
  var lastSecond = -1;
  function paint(force){
    var now = new Date(serverNow());
    var sec = now.getSeconds();
    if(!force && sec === lastSecond) return;
    lastSecond = sec;

    var localOff = -now.getTimezoneOffset();

    nodes.forEach(function(n){
      var p = partsFor(n.zone.tz, now);
      var h24 = Number(p.hour) % 24;
      var m = Number(p.minute), s = Number(p.second);

      var hh = h24, mer = "";
      if(cfg.hour12){
        mer = h24 < 12 ? "AM" : "PM";
        hh = h24 % 12; if(hh === 0) hh = 12;
      }
      var hStr = cfg.hour12 ? String(hh) : String(hh).padStart(2,"0");
      n.hm.textContent = hStr + ":" + String(m).padStart(2,"0");
      n.sec.textContent = cfg.seconds ? String(s).padStart(2,"0") : "";
      n.mer.textContent = cfg.hour12 ? mer : "";

      // ambient sky for this city's local hour
      n.row.style.setProperty("--sky", skyFor(h24 + m/60));

      // working-hours state
      var wd = p.weekday;
      var weekend = (wd === "Sat" || wd === "Sun");
      var label;
      if (weekend) label = "Weekend";
      else if (h24 >= 9 && h24 < 17) label = "Working hours";
      else if (h24 >= 7 && h24 < 21) label = "Off hours";
      else label = "Asleep";
      n.state.textContent = label;

      // date + zone abbreviation
      n.date.style.display = cfg.date ? "" : "none";
      n.date.previousElementSibling.style.display = cfg.date ? "" : "none"; // the dot
      if(cfg.date) n.date.textContent = wd + " " + p.day + " " + p.month + " · " + tzAbbr(n.zone.tz, now);

      // offset relative to the viewer
      var zOff = tzOffsetMinutes(n.zone.tz, now);
      var delta = (zOff - localOff) / 60;
      if(n.zone.tz === localZone){
        n.offset.textContent = "you are here";
        n.offset.className = "offset here";
      } else {
        var sign = delta > 0 ? "+" : (delta < 0 ? "\u2212" : "\u00B1");
        var abs = Math.abs(delta);
        var str = (abs % 1 === 0) ? String(abs) : abs.toFixed(1);
        n.offset.textContent = delta === 0 ? "same as you" : sign + str + " h vs you";
        n.offset.className = "offset";
      }
    });
  }

  /* ---------------- controls ---------------- */
  var f24 = document.getElementById("f24"),
      f12 = document.getElementById("f12"),
      tSec = document.getElementById("tSec"),
      tDate = document.getElementById("tDate"),
      tTheme = document.getElementById("tTheme");

  function syncControls(){
    f24.setAttribute("aria-pressed", String(!cfg.hour12));
    f12.setAttribute("aria-pressed", String(cfg.hour12));
    tSec.setAttribute("aria-pressed", String(cfg.seconds));
    tDate.setAttribute("aria-pressed", String(cfg.date));
    tTheme.setAttribute("aria-pressed", String(cfg.light));
    document.documentElement.setAttribute("data-theme", cfg.light ? "light" : "dark");
  }

  f24.addEventListener("click", function(){ cfg.hour12=false; save(); syncControls(); paint(true); });
  f12.addEventListener("click", function(){ cfg.hour12=true;  save(); syncControls(); paint(true); });
  tSec.addEventListener("click", function(){ cfg.seconds=!cfg.seconds; save(); syncControls(); paint(true); });
  tDate.addEventListener("click", function(){ cfg.date=!cfg.date; save(); syncControls(); paint(true); });
  tTheme.addEventListener("click", function(){ cfg.light=!cfg.light; save(); syncControls(); });
  document.getElementById("btnSync").addEventListener("click", sync);

  /* ---------------- clock size (+ / − by 2px) ---------------- */
  var FS_MIN=28, FS_MAX=160, FS_STEP=2;
  var fsMinus=document.getElementById("fsMinus"),
      fsPlus=document.getElementById("fsPlus"),
      fsLabel=document.getElementById("fsLabel");
  if(cfg.fontSize==null){
    // First run: adopt whatever size the responsive clamp() resolved to at the current
    // width, so turning on manual control doesn't cause a visible jump.
    var sample = nodes.length ? nodes[0].row.querySelector(".time") : null;
    var resolved = sample ? parseFloat(getComputedStyle(sample).fontSize) : 64;
    cfg.fontSize = Math.round(resolved) || 64;
  }
  function applyFontSize(){
    cfg.fontSize = Math.max(FS_MIN, Math.min(FS_MAX, cfg.fontSize));
    document.documentElement.style.setProperty("--time-fs", cfg.fontSize+"px");
    fsLabel.textContent = cfg.fontSize+"px";
    fsMinus.disabled = cfg.fontSize<=FS_MIN;
    fsPlus.disabled = cfg.fontSize>=FS_MAX;
  }
  fsMinus.addEventListener("click", function(){ cfg.fontSize-=FS_STEP; save(); applyFontSize(); });
  fsPlus.addEventListener("click", function(){ cfg.fontSize+=FS_STEP; save(); applyFontSize(); });
  applyFontSize();

  /* ---------------- weather (Open-Meteo — free, no API key required) ---------------- */
  var WX_REFRESH_MS = 60 * 60 * 1000; // re-check every hour, per city
  var WX_TIMEOUT_MS = 10000;
  // WMO weather-code -> [short description, icon]. https://open-meteo.com/en/docs
  var WX_CODES = {
    0:["Clear","\u2600\ufe0f"], 1:["Mainly clear","\ud83c\udf24\ufe0f"], 2:["Partly cloudy","\u26c5"], 3:["Overcast","\u2601\ufe0f"],
    45:["Fog","\ud83c\udf2b\ufe0f"], 48:["Fog","\ud83c\udf2b\ufe0f"],
    51:["Light drizzle","\ud83c\udf26\ufe0f"], 53:["Drizzle","\ud83c\udf26\ufe0f"], 55:["Dense drizzle","\ud83c\udf26\ufe0f"],
    56:["Freezing drizzle","\ud83c\udf27\ufe0f"], 57:["Freezing drizzle","\ud83c\udf27\ufe0f"],
    61:["Light rain","\ud83c\udf27\ufe0f"], 63:["Rain","\ud83c\udf27\ufe0f"], 65:["Heavy rain","\ud83c\udf27\ufe0f"],
    66:["Freezing rain","\ud83c\udf27\ufe0f"], 67:["Freezing rain","\ud83c\udf27\ufe0f"],
    71:["Light snow","\ud83c\udf28\ufe0f"], 73:["Snow","\ud83c\udf28\ufe0f"], 75:["Heavy snow","\ud83c\udf28\ufe0f"], 77:["Snow grains","\ud83c\udf28\ufe0f"],
    80:["Rain showers","\ud83c\udf26\ufe0f"], 81:["Rain showers","\ud83c\udf26\ufe0f"], 82:["Violent showers","\u26c8\ufe0f"],
    85:["Snow showers","\ud83c\udf28\ufe0f"], 86:["Snow showers","\ud83c\udf28\ufe0f"],
    95:["Thunderstorm","\u26c8\ufe0f"], 96:["Thunderstorm, hail","\u26c8\ufe0f"], 99:["Thunderstorm, hail","\u26c8\ufe0f"]
  };
  function wxDescribe(code){ return WX_CODES[code] || ["Weather", "\ud83c\udf24\ufe0f"]; }

  function fetchWeather(node){
    var z = node.zone;
    if(!node.wx) return;
    var unitParam = z.unit === "f" ? "fahrenheit" : "celsius";
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + z.lat + "&longitude=" + z.lon +
              "&current_weather=true&temperature_unit=" + unitParam;
    var controller = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = controller ? setTimeout(function(){ controller.abort(); }, WX_TIMEOUT_MS) : null;
    fetch(url, controller ? { signal: controller.signal } : {})
      .then(function(r){ if(!r.ok) throw new Error("bad status"); return r.json(); })
      .then(function(data){
        if(timer) clearTimeout(timer);
        var cw = data && data.current_weather;
        if(!cw || typeof cw.temperature !== "number") throw new Error("no current_weather in response");
        var d = wxDescribe(cw.weathercode);
        var t = Math.round(cw.temperature);
        var unitSym = z.unit === "f" ? "\u00b0F" : "\u00b0C";
        node.wx.textContent = d[1] + " " + t + unitSym;
        node.wx.title = z.place + " \u2014 " + d[0] + ", " + t + unitSym;
      })
      .catch(function(){
        if(timer) clearTimeout(timer);
        node.wx.textContent = "\u2014";
        node.wx.title = "Weather unavailable for " + z.place + " (offline, or the request timed out)";
      });
  }
  function refreshAllWeather(){ nodes.forEach(fetchWeather); }

  syncControls();
  // A thrown error inside paint() would kill the setInterval and freeze the clock forever.
  // Wrap it so one bad tick can never stop the ticking; also force a full re-render once per
  // second as a backup in case the 200ms sampler ever misses the second boundary.
  function safePaint(force){
    try { paint(force); }
    catch(e){ try { console.warn("world-clock paint error:", e); } catch(_){} }
  }
  safePaint(true);
  setInterval(function(){ safePaint(false); }, 200);
  setInterval(function(){ safePaint(true); }, 1000);
  setInterval(sync, 10 * 60 * 1000);
  sync();
  refreshAllWeather();
  setInterval(refreshAllWeather, WX_REFRESH_MS);
  document.getElementById("btnSync").addEventListener("click", refreshAllWeather);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) { safePaint(true); sync(); refreshAllWeather(); } });

  window.__wc = { paint: paint, cfg: cfg, nodes: nodes, skyFor: skyFor, tzOffsetMinutes: tzOffsetMinutes };
})();
</script>
</body>
</html>
